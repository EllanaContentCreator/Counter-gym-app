# Publishes Counter to GitHub Pages every time main changes.
# Site address: https://ellanacontentcreator.github.io/Counter-gym-app/
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /Counter-gym-app/
          # Where the sheet reader lives, baked into the build so nobody in the
          # group has to set anything up. Set it once in the repository's
          # Settings -> Secrets and variables -> Actions -> Variables, and every
          # future build carries it.
          #
          # The passcode is a speed bump, not a secret: it ends up in the
          # published JavaScript, where anyone can read it. It stops someone who
          # merely stumbles on the function address, nothing more.
          VITE_READER_URL: ${{ vars.VITE_READER_URL }}
          VITE_READER_PASSCODE: ${{ vars.VITE_READER_PASSCODE }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
